<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Login Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(-45deg,#1d2671,#c33764,#0f2027,#203a43);
    background-size:400% 400%;
    animation:bgAnimation 10s ease infinite;
}

/* Animated Background */
@keyframes bgAnimation{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

/* Floating Circles */

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    animation:float 6s ease-in-out infinite;
}

.circle:nth-child(1){
    width:180px;
    height:180px;
    top:40px;
    left:40px;
}

.circle:nth-child(2){
    width:250px;
    height:250px;
    bottom:50px;
    right:50px;
    animation-duration:8s;
}

.circle:nth-child(3){
    width:120px;
    height:120px;
    top:70%;
    left:20%;
    animation-duration:10s;
}

/* Floating Animation */

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-25px);
    }
}

/* Login Box */

.container{

    width:350px;

    padding:35px;

    text-align:center;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.3);

    border-radius:20px;

    box-shadow:0 0 25px rgba(0,0,0,.5);

    animation:fadeIn 1.2s ease,
              loginFloat 4s ease-in-out infinite;
}

/* Login Box Animation */

@keyframes loginFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

/* Fade In */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

h2{

    color:white;

    font-size:38px;

    margin-bottom:25px;

    text-shadow:
    0 0 10px cyan,
    0 0 20px cyan;
}

/* Input */

input{

    width:100%;

    padding:12px;

    margin:12px 0;

    border:none;

    outline:none;

    border-radius:30px;

    background:rgba(255,255,255,.25);

    color:white;

    font-size:15px;
}

input::placeholder{

    color:white;
}

input:focus{

    box-shadow:0 0 15px cyan;
}

/* Button */

button{

    width:100%;

    padding:12px;

    border:none;

    border-radius:30px;

    cursor:pointer;

    color:white;

    font-size:17px;

    background:linear-gradient(90deg,#00c6ff,#0072ff);

    transition:.4s;
}

button:hover{

    transform:scale(1.05);

    box-shadow:0 0 20px cyan;
}

/* Text */

p{

    margin-top:18px;

    color:white;
}

a{

    color:cyan;

    text-decoration:none;

    font-weight:bold;
}

a:hover{

    text-decoration:underline;
}

</style>

</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">

<h2>LOGIN</h2>

<form>

<input type="text" placeholder="Username" required>

<input type="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<p>Don't have an account?
<a href="#">Register</a>
</p>

</div>

</body>
</html>
